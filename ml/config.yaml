# ChemVision AI — ML Training Configuration
# Reaction Type Classifier: EfficientNet-B0 (transfer learning)
# Dataset: CHEMVISION.v7i.coco (COCO-format image classification)

dataset:
  root: "../CHEMVISION.v7i.coco"
  train_dir: "train"
  valid_dir: "valid"
  test_dir:  "test"
  annotation_file: "_annotations.coco.json"

model:
  architecture: "efficientnet_b0"   # torchvision pretrained
  num_classes:   39                  # classes actually present in train split
  pretrained:    true
  dropout:       0.3

training:
  image_size:    224
  batch_size:    8                   # small dataset → small batch
  epochs:        50
  learning_rate: 0.0005
  weight_decay:  0.0001
  patience:      10                  # early-stopping patience
  seed:          42
  num_workers:   0                   # 0 = main process (Windows safe)
  device:        "cpu"               # change to "cuda" if GPU available

augmentation:
  train:
    - random_horizontal_flip: 0.5
    - random_vertical_flip:   0.3
    - random_rotation:        15
    - color_jitter:
        brightness: 0.2
        contrast:   0.2
    - normalize:
        mean: [0.485, 0.456, 0.406]
        std:  [0.229, 0.224, 0.225]
  val:
    - normalize:
        mean: [0.485, 0.456, 0.406]
        std:  [0.229, 0.224, 0.225]

output:
  checkpoint_dir: "../backend/models/chemvision_classifier"
  best_model:     "best_model.pth"
  class_map:      "class_map.json"
  training_log:   "training_log.json"
  eval_report:    "eval_report.json"
